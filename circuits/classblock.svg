<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" aria-label="Inside one class-attention block of ParT: query, keys, values, attention weights, weighted sum, output, MLP; then the neurons and the scores." viewBox="0 0 1664 642" style="width:1664px; height:642px; flex-shrink:0"><g font-family="IBM Plex Sans, system-ui, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A94A3"/></marker></defs><rect x="0" y="20" width="250" height="116" rx="10" fill="#FFF8EC" stroke="#B7791F" stroke-width="2.5"/><text x="12" y="46" font-size="19" font-weight="600" fill="#B7791F">class token c</text><text x="12" y="72" font-size="16" fill="#3F4A5A">one vector: <tspan font-weight="600">128</tspan> numbers</text><text x="12" y="94" font-size="13" fill="#8A94A3">learned; in block 2: block 1’s</text><text x="12" y="116" font-size="13" fill="#8A94A3">output</text><rect x="0" y="180" width="250" height="200" rx="10" fill="#F4F6F8" stroke="#3F4A5A" stroke-width="2.5"/><text x="12" y="206" font-size="19" font-weight="600" fill="#3F4A5A">particle embeddings</text><text x="12" y="232" font-size="16" fill="#3F4A5A">x₁ … x₁₂₈: <tspan font-weight="600">128 × 128</tspan></text><text x="12" y="254" font-size="13" fill="#1D2433">128 particle slots (empty</text><text x="12" y="276" font-size="13" fill="#8A94A3">slots masked) · from the 8</text><text x="12" y="298" font-size="13" fill="#8A94A3">particle blocks</text><rect x="20" y="320" width="28" height="48" rx="3" fill="#D5DAE1"/><rect x="56" y="320" width="28" height="48" rx="3" fill="#D5DAE1"/><rect x="92" y="320" width="28" height="48" rx="3" fill="#D5DAE1"/><rect x="128" y="320" width="28" height="48" rx="3" fill="#D5DAE1"/><rect x="164" y="320" width="28" height="48" rx="3" fill="#D5DAE1"/><rect x="200" y="320" width="28" height="48" rx="3" fill="#D5DAE1"/><text x="20" y="314" font-size="12" fill="#8A94A3">one column per particle:</text><rect x="290" y="6" width="930" height="452" rx="14" fill="none" stroke="#1F4E79" stroke-width="2" stroke-dasharray="7 5"/><text x="306" y="30" font-size="18" font-weight="600" fill="#1F4E79">one head h (8 heads in parallel, 16 numbers each)</text><rect x="310" y="50" width="270" height="100" rx="10" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.5"/><text x="322" y="76" font-size="19" font-weight="600" fill="#1F4E79">query  q = W_Q · c</text><text x="322" y="102" font-size="16" fill="#3F4A5A"><tspan font-weight="600">16</tspan> numbers: the question</text><text x="322" y="124" font-size="13" fill="#8A94A3">W_Q: 16 × 128, learned</text><rect x="310" y="190" width="270" height="120" rx="10" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.5"/><text x="322" y="216" font-size="19" font-weight="600" fill="#1F4E79">keys  kⱼ = W_K · LN(xⱼ)</text><text x="322" y="242" font-size="16" fill="#3F4A5A"><tspan font-weight="600">129 × 16</tspan></text><text x="322" y="264" font-size="13" fill="#8A94A3">j = the 128 particle slots</text><text x="322" y="286" font-size="13" fill="#8A94A3">and the class token itself</text><rect x="310" y="330" width="270" height="100" rx="10" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.5"/><text x="322" y="356" font-size="19" font-weight="600" fill="#1F4E79">values  vⱼ = W_V · LN(xⱼ)</text><text x="322" y="382" font-size="16" fill="#3F4A5A"><tspan font-weight="600">129 × 16</tspan>: what j says</text><text x="322" y="404" font-size="13" fill="#8A94A3">W_K, W_V: 16 × 128 each</text><path d="M 250 70 C 279.0 70, 279.0 100, 308 100" fill="none" stroke="#8A94A3" stroke-width="2.5"  marker-end="url(#a)"/><path d="M 250 260 C 279.0 260, 279.0 250, 308 250" fill="none" stroke="#8A94A3" stroke-width="2.5"  marker-end="url(#a)"/><path d="M 250 300 C 279.0 300, 279.0 370, 308 370" fill="none" stroke="#8A94A3" stroke-width="2.5"  marker-end="url(#a)"/><rect x="620" y="50" width="280" height="150" rx="10" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.5"/><text x="632" y="76" font-size="19" font-weight="600" fill="#1F4E79">score  sⱼ = q · kⱼ / √16</text><text x="632" y="102" font-size="15" fill="#3F4A5A">a dot product per particle:</text><text x="632" y="124" font-size="15" fill="#3F4A5A">how well j answers the question</text><text x="632" y="146" font-size="15" fill="#3F4A5A"><tspan font-weight="600">129</tspan> numbers; empty slots</text><text x="632" y="168" font-size="15" fill="#3F4A5A">are masked (α = 0)</text><rect x="620" y="230" width="280" height="186" rx="10" fill="#FFF4EE" stroke="#C05621" stroke-width="2.5"/><text x="632" y="256" font-size="19" font-weight="600" fill="#C05621">attention  αⱼ = softmax(s)</text><text x="632" y="282" font-size="15" fill="#3F4A5A">αⱼ = e^sⱼ / Σₖ e^sₖ</text><text x="632" y="304" font-size="15" fill="#3F4A5A">≥ 0 and Σⱼ αⱼ = 1: the share</text><text x="632" y="326" font-size="15" fill="#3F4A5A">of the head’s reading on j</text><text x="632" y="348" font-size="13" fill="#8A94A3">α on the class token itself:</text><text x="632" y="370" font-size="13" fill="#8A94A3">the head reads no particle</text><path d="M 580 100 C 599.0 100, 599.0 110, 618 110" fill="none" stroke="#8A94A3" stroke-width="2.5"  marker-end="url(#a)"/><path d="M 580 250 C 599.0 250, 599.0 140, 618 140" fill="none" stroke="#8A94A3" stroke-width="2.5"  marker-end="url(#a)"/><path d="M 760 200 C 760.0 200, 760.0 228, 760 228" fill="none" stroke="#8A94A3" stroke-width="2.5"  marker-end="url(#a)"/><rect x="940" y="120" width="260" height="190" rx="10" fill="#EEF4FB" stroke="#1F4E79" stroke-width="2.5"/><text x="952" y="146" font-size="19" font-weight="600" fill="#1F4E79">head output</text><text x="952" y="172" font-size="17" fill="#1D2433">o = Σⱼ αⱼ · vⱼ</text><text x="952" y="194" font-size="15" fill="#3F4A5A"><tspan font-weight="600">16</tspan> numbers: the values,</text><text x="952" y="216" font-size="15" fill="#3F4A5A">weighted by attention</text><text x="952" y="238" font-size="13" fill="#8A94A3">(a weighted average of</text><text x="952" y="260" font-size="13" fill="#8A94A3">what the particles say)</text><path d="M 900 320 C 919.0 320, 919.0 230, 938 230" fill="none" stroke="#8A94A3" stroke-width="2.5"  marker-end="url(#a)"/><path d="M 580 400 C 600 440, 620 440, 640 440 L 900 440 C 925 440, 915 300, 936 290" fill="none" stroke="#8A94A3" stroke-width="2.5" marker-end="url(#a)"/><text x="700" y="434" font-size="13" fill="#8A94A3">the values, weighted by α</text><rect x="1250" y="20" width="230" height="170" rx="10" fill="#F6F2FA" stroke="#6B4E9B" stroke-width="2.5"/><text x="1262" y="46" font-size="19" font-weight="600" fill="#6B4E9B">mix the 8 heads</text><text x="1262" y="72" font-size="14" fill="#3F4A5A">concatenate: 8 × 16 = <tspan font-weight="600">128</tspan></text><text x="1262" y="94" font-size="14" fill="#3F4A5A">× W_O (128 × 128)</text><text x="1262" y="116" font-size="14" fill="#3F4A5A">normalise (LayerNorm)</text><text x="1262" y="138" font-size="14" fill="#3F4A5A">+ c (residual)</text><rect x="1250" y="210" width="230" height="140" rx="10" fill="#F6F2FA" stroke="#6B4E9B" stroke-width="2.5"/><text x="1262" y="236" font-size="19" font-weight="600" fill="#6B4E9B">MLP</text><text x="1262" y="262" font-size="15" fill="#3F4A5A">128 → 512 → 128</text><text x="1262" y="284" font-size="14" fill="#3F4A5A">(GELU), + residual</text><text x="1262" y="306" font-size="14" fill="#1D2433">= the new class token</text><path d="M 1200 215 C 1224.0 215, 1224.0 100, 1248 100" fill="none" stroke="#8A94A3" stroke-width="2.5"  marker-end="url(#a)"/><path d="M 1365 190 C 1365.0 190, 1365.0 208, 1365 208" fill="none" stroke="#8A94A3" stroke-width="2.5"  marker-end="url(#a)"/><rect x="1500" y="20" width="164" height="120" rx="10" fill="#F6F2FA" stroke="#6B4E9B" stroke-width="2.5"/><text x="1512" y="46" font-size="17" font-weight="600" fill="#6B4E9B">× 2 blocks</text><text x="1512" y="72" font-size="13" fill="#3F4A5A">block 2 asks its</text><text x="1512" y="94" font-size="13" fill="#3F4A5A">own question with</text><text x="1512" y="116" font-size="13" fill="#3F4A5A">block 1’s token</text><rect x="1500" y="170" width="164" height="120" rx="10" fill="#FFF8EC" stroke="#B7791F" stroke-width="2.5"/><text x="1512" y="196" font-size="17" font-weight="600" fill="#B7791F">128 neurons z</text><text x="1512" y="222" font-size="13" fill="#3F4A5A">LayerNorm of</text><text x="1512" y="244" font-size="13" fill="#3F4A5A">the final token</text><text x="1512" y="266" font-size="12" fill="#8A94A3">(13 vary: active)</text><rect x="1500" y="320" width="164" height="120" rx="10" fill="#EFF8F2" stroke="#2F855A" stroke-width="2.5"/><text x="1512" y="346" font-size="17" font-weight="600" fill="#2F855A">10 scores</text><text x="1512" y="372" font-size="13" fill="#3F4A5A">W (10 × 128) · z + b</text><text x="1512" y="394" font-size="13" fill="#3F4A5A">the 10 JetClass</text><text x="1512" y="416" font-size="13" fill="#3F4A5A">classes</text><path d="M 1480 280 C 1489.0 280, 1489.0 80, 1498 80" fill="none" stroke="#8A94A3" stroke-width="2.5"  marker-end="url(#a)"/><path d="M 1582 140 C 1582.0 140, 1582.0 168, 1582 168" fill="none" stroke="#8A94A3" stroke-width="2.5"  marker-end="url(#a)"/><path d="M 1582 290 C 1582.0 290, 1582.0 318, 1582 318" fill="none" stroke="#8A94A3" stroke-width="2.5"  marker-end="url(#a)"/><rect x="0" y="478" width="1664" height="160" rx="12" fill="#FAFAF7" stroke="#D5DAE1"/><text x="16" y="508" font-size="19" font-weight="600" fill="#1D2433">What our two fits replace, and what a circuit is</text><rect x="16" y="524" width="16" height="16" fill="#C05621" fill-opacity="0.8"/><text x="40" y="538" font-size="17" fill="#1D2433"><tspan font-weight="600">Attention-weights fit:</tspan> the score sⱼ written as if-statements on 314 inputs of particle j (its pT, type, displacement, neighbourhood…), then the same softmax → α.</text><rect x="16" y="558" width="16" height="16" fill="#B7791F"/><text x="40" y="572" font-size="17" fill="#1D2433"><tspan font-weight="600">Class-token fit:</tspan> everything after α (values, W_O, MLP, norm) written per particle: neuron n = Σ<tspan font-size="12" dy="4">heads h</tspan><tspan dy="-4"> Σ</tspan><tspan font-size="12" dy="4">particles j</tspan><tspan dy="-4"> αₕⱼ · fₕₙ(particle j) + cₕₙ · αₕ,class token.</tspan></text><text x="40" y="594" font-size="15" fill="#3F4A5A">f = if-statements on 38 inputs of the particle, each linear and above / below 5 thresholds: 420 terms per head, 6,720 per neuron.</text><rect x="16" y="610" width="16" height="16" fill="#1F4E79"/><text x="40" y="624" font-size="17" fill="#1D2433"><tspan font-weight="600">A circuit:</tspan> the few heads h and neurons n whose parts of score(a) − score(b) carry a decision; the 10 scores are linear in the 128 neurons, so the parts add up exactly.</text></g></svg>