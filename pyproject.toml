[project]
name = "jetdistill"
version = "0.1.0"
description = "The JEDI-linear jet tagger's last hidden layer distilled into if-statements on jet physics observables"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "jax", "keras", "hgq2", "scikit-learn", "h5py"]
optional-dependencies = { test = ["pytest"] }

[tool.setuptools.packages.find]
include = ["jetdistill*"]
